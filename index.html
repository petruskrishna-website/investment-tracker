<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Record Terminal</title>
  <style>
    :root {
      --bg-color: #0c0f12;
      --card-bg: #141920;
      --border-color: #2a3441;
      --text-main: #d1d5db;
      --text-header: #ff9d00; /* Bloomberg Amber */
      --accent-green: #00e676;
      --accent-dim: #1f2937;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      padding: 16px;
    }

    header {
      border-bottom: 2px solid var(--text-header);
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      color: var(--text-header);
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    .status-badge {
      font-size: 0.75rem;
      color: var(--accent-green);
      background: rgba(0, 230, 118, 0.1);
      padding: 4px 8px;
      border: 1px solid var(--accent-green);
      border-radius: 4px;
      white-space: nowrap;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 950px) {
      body {
        padding: 10px;
      }
      header h1 {
        font-size: 1.1rem;
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .card-title {
      background-color: var(--accent-dim);
      color: var(--text-header);
      padding: 10px 14px;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      background-color: rgba(255, 255, 255, 0.03);
      color: #9ca3af;
      font-weight: 600;
    }

    td {
      color: #e5e7eb;
    }

    /* Gain Color Highlights */
    .gain-positive {
      color: var(--accent-green) !important;
      font-weight: bold;
    }

    .gain-negative {
      color: var(--accent-red) !important;
      font-weight: bold;
    }

    /* Text Wrapping Rules for Reksa Dana & Learning Tables */
    #reksa-table,
    #learning-table {
      table-layout: auto;
    }

    #reksa-table th, #reksa-table td,
    #learning-table th, #learning-table td {
      white-space: normal;
      word-break: break-word;
      overflow: visible;
      text-overflow: clip;
    }
  </style>
</head>
<body>

  <header>
    <h1>SYSTEM // INVESTMENT_RECORD</h1>
    <div class="status-badge">READ ONLY TERMINAL</div>
  </header>

  <div class="dashboard-grid">
    <!-- Left Column (Main / Expanded) -->
    <div class="column">
      <!-- 1. SAHAM -->
      <div class="card">
        <div class="card-title">SAHAM</div>
        <div class="table-container">
          <table style="min-width: 600px;">
            <thead>
              <tr>
                <th style="width: 35px;">No</th>
                <th style="width: 80px;">Emiten</th>
                <th style="width: 80px;">Price</th>
                <th style="width: 70px;">Action</th>
                <th style="width: 50px;">Lot</th>
                <th style="width: 70px;">% Gain</th>
                <th style="width: 80px;">Broker</th>
                <th style="width: 90px;">Date</th>
              </tr>
            </thead>
            <tbody id="saham-body"></tbody>
          </table>
        </div>
      </div>

      <!-- 2. SAHAM LUAR NEGERI & INDICES & CRYPTO -->
      <div class="card">
        <div class="card-title">Saham Luar Negeri & Indices & Crypto</div>
        <div class="table-container">
          <table style="min-width: 500px;">
            <thead>
              <tr>
                <th style="width: 35px;">No</th>
                <th style="width: 140px;">Emiten/Commodity</th>
                <th style="width: 80px;">Profit</th>
                <th style="width: 70px;">% Gain</th>
                <th style="width: 90px;">Date</th>
              </tr>
            </thead>
            <tbody id="foreign-body"></tbody>
          </table>
        </div>
      </div>

      <!-- 3. PAPER TRADING / STILL LEARNING -->
      <div class="card">
        <div class="card-title">Paper Trading / Still Learning</div>
        <div class="table-container">
          <table id="learning-table">
            <thead>
              <tr>
                <th style="width: 35px;">No</th>
                <th>Notes & Strategy</th>
              </tr>
            </thead>
            <tbody id="learning-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right Column (Smaller / Compact) -->
    <div class="column">
      <!-- REKSA DANA -->
      <div class="card">
        <div class="card-title">Reksa Dana</div>
        <div class="table-container">
          <table id="reksa-table">
            <thead>
              <tr>
                <th style="width: 30px;">No</th>
                <th>Nama Reksa Dana</th>
                <th>Jenis</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody id="reksa-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded Data Array - Edit items directly here
    const store = {
      saham: [
        { emiten: "BBCA", price: "8,300", action: "L.BUY", lot: "9", gain: "", broker: "MIRAE ASSET", date: "2025-08-04" },
        { emiten: "COIN", price: "1,780", action: "L.BUY", lot: "3", gain: "", broker: "MIRAE ASSET", date: "2025-08-11" },
        { emiten: "COIN", price: "2,031", action: "Auto Order", lot: "3", gain: "", broker: "MIRAE ASSET", date: "2025-08-12" },
        { emiten: "COIN", price: "2,200", action: "L.SELL", lot: "6", gain: "14.97%", broker: "MIRAE ASSET", date: "2025-08-27" },
        { emiten: "BBCA", price: "8,100", action: "L.BUY", lot: "4", gain: "", broker: "MIRAE ASSET", date: "2025-09-02" },
        { emiten: "EMAS", price: "3,600", action: "L.BUY", lot: "3", gain: "", broker: "MIRAE ASSET", date: "2025-09-26" },
        { emiten: "EMAS", price: "3,800", action: "L.SELL", lot: "3", gain: "5.31%", broker: "MIRAE ASSET", date: "2025-09-26" },
        { emiten: "COIN", price: "3,240", action: "L.BUY", lot: "5", gain: "", broker: "MIRAE ASSET", date: "2025-09-29" },
        { emiten: "COIN", price: "3,850", action: "L.BUY", lot: "2", gain: "", broker: "MIRAE ASSET", date: "2025-09-30" },
        { emiten: "COIN", price: "3,600", action: "Auto Order", lot: "5", gain: "5.02%", broker: "MIRAE ASSET", date: "2025-09-30" },
        { emiten: "CUAN", price: "1,600", action: "L.BUY", lot: "5", gain: "", broker: "MIRAE ASSET", date: "2025-09-30" },
        { emiten: "COIN", price: "3,300", action: "L.BUY", lot: "2", gain: "", broker: "MIRAE ASSET", date: "2025-10-02" },
        { emiten: "CUAN", price: "2,210", action: "Auto Order", lot: "5", gain: "37.57%", broker: "MIRAE ASSET", date: "2025-10-10" },
        { emiten: "COIN", price: "3,300", action: "L.BUY", lot: "1", gain: "", broker: "MIRAE ASSET", date: "2025-10-16" },
        { emiten: "COIN", price: "3,230", action: "L.BUY", lot: "4", gain: "", broker: "MIRAE ASSET", date: "2025-10-30" },
        { emiten: "COIN", price: "3,910", action: "L.SELL", lot: "9", gain: "22.14%", broker: "MIRAE ASSET", date: "2025-12-17" },
      ],
      reksa: [
        { nama: "Sample text", jenis: "Pasar Uang", ket: "Sample text description for mutual fund allocation" }
      ],
      foreign: [
        { emiten: "NVDA", profit: "+$450", gain: "28.4%", date: "2026-09-16" },
        { emiten: "Sample text", profit: "-$50", gain: "-1.5%", date: "2026-09-16" }
      ],
      learning: [
        { note: "Sample text - Forex Trading and Less Aggressive Strategy Building" },
        { note: "Sample text - Better entry protocol and risk management to avoid bearish news from...etc" }
      ]
    };

    function formatGainCell(value) {
      if (!value) return '';
      const cleanNum = parseFloat(value.toString().replace(/[^0-9.-]/g, ''));
      if (isNaN(cleanNum)) return value;
      if (cleanNum >= 0.01) return `<span class="gain-positive">${value}</span>`;
      if (cleanNum < 0) return `<span class="gain-negative">${value}</span>`;
      return value;
    }

    function renderTables() {
      document.getElementById('saham-body').innerHTML = store.saham.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${item.emiten || ''}</td>
          <td>${item.price || ''}</td>
          <td>${item.action || ''}</td>
          <td>${item.lot || ''}</td>
          <td>${formatGainCell(item.gain)}</td>
          <td>${item.broker || ''}</td>
          <td>${item.date || ''}</td>
        </tr>
      `).join('');

      document.getElementById('reksa-body').innerHTML = store.reksa.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${item.nama || ''}</td>
          <td>${item.jenis || ''}</td>
          <td>${item.ket || ''}</td>
        </tr>
      `).join('');

      document.getElementById('foreign-body').innerHTML = store.foreign.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${item.emiten || ''}</td>
          <td>${formatGainCell(item.profit)}</td>
          <td>${formatGainCell(item.gain)}</td>
          <td>${item.date || ''}</td>
        </tr>
      `).join('');

      document.getElementById('learning-body').innerHTML = store.learning.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${item.note || ''}</td>
        </tr>
      `).join('');
    }

    renderTables();
  </script>
</body>
</html>
